name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      # Catches a manifest fault here rather than in the release job: vsce
      # rejects an @types/vscode that is newer than engines.vscode, and
      # nothing above this step validates the manifest.
      - run: npx @vscode/vsce package --no-dependencies -o extension.vsix
